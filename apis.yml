aid: aiforcetech
name: AIForce Technology
description: 'AIForce Technology (Beijing Zhongke Yuandongli Technology Co., Ltd. / 北京中科原动力科技有限公司)
  is a Beijing agricultural-robotics manufacturer incubated out of the Chinese Academy
  of Sciences Institute of Microelectronics, registered in 2018 and operating since
  July 2019, with Chinese Academy of Engineering academician Li Deyi as chief scientist.
  It builds autonomous and battery-electric farm machinery across four product lines:
  the Wantu (万途) electric intelligent tractors, the Zhiniu (智牛) unmanned agricultural
  machines, the Zhinong (智农) multi-function field robots, and the Zhiyun (智耘) unmanned-operation
  system that adds full-day autonomous tillage, planting, crop management and harvest
  to existing machinery in dry fields, paddies and greenhouses, paired with a mobile
  app and telemetry cloud for route setting and operation monitoring. It is a hardware
  company that sells machines and retrofit systems to farms, cooperatives and agricultural
  enterprises, backed by Vertex Ventures China, Chery and CCV among others, and named
  champion of PepsiCo''s Greenhouse Accelerator APAC edition for an AI-powered low-carbon
  automatic tractor. aiforcetech.com is a five-section Chinese marketing site with
  no developer program, API, SDK or machine-readable specification of any kind.'
